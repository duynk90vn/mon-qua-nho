<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <title>Một món quà nhỏ gửi đến em</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage">
    <img class="portrait" src="HDT.png" alt="Món quà nhỏ">

    <section class="message" aria-label="Lời chúc">
      <h1>
        <span>Chúc cháu luôn vui vẻ</span>
        <span>và gặp thật nhiều điều dễ thương</span>
      </h1>
      <p>Một món quà nhỏ gửi đến em</p>
    </section>

    <button class="exit-button" id="exitButton" type="button">EXIT</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
