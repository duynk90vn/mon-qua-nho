<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Một món quà nhỏ gửi đến cháu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gift-shell">
    <section class="stage" id="stage" aria-label="Ảnh và pháo hoa">
      <img class="portrait" src="HDT.png" alt="Món quà nhỏ">
      <canvas id="fireworksCanvas" aria-hidden="true"></canvas>
      <button class="exit-button" id="exitButton" type="button">EXIT</button>
    </section>

    <section class="message" id="message" aria-label="Lời chúc">
      <h1>
        <span>Chúc cháu luôn vui vẻ</span>
        <span>và gặp thật nhiều điều dễ thương</span>
      </h1>
      <p>Một món quà nhỏ gửi đến cháu</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
